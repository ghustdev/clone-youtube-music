services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: youtube_music
      POSTGRES_USER: music_user
      POSTGRES_PASSWORD: devs
    volumes:
      - youtube_music_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_user -d youtube_music"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/youtube_music
      DATABASE_USERNAME: music_user
      DATABASE_PASSWORD: devs
      JWT_SECRET: dev-only-secret-key-change-me-with-at-least-32-characters
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://127.0.0.1:3000
      SEED_ENABLED: "true"
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@youtubemusic.local
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3001:3000"

volumes:
  youtube_music_postgres_data: