spring.application.name=youtube-music-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/youtube_music}
spring.datasource.username=${DATABASE_USERNAME:music_user}
spring.datasource.password=${DATABASE_PASSWORD:devs}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-with-at-least-32-characters}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

app.seed.enabled=${SEED_ENABLED:true}
app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@youtubemusic.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
