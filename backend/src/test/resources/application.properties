spring.application.name=youtube-music-backend-test

spring.datasource.url=jdbc:h2:mem:youtube_music_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false

jwt.secret=test-only-secret-key-change-me-with-at-least-32-characters
jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000
app.seed.enabled=true
app.admin.name=Admin
app.admin.email=admin@youtubemusic.local
app.admin.password=admin123
